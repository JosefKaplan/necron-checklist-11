<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Necron Turn Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Necrodermis: cool steel neutrals; gauss green marks your turn, ember marks the opponent's, dynastic gold is CP.
     Layout: sticky tracker (round / turn / CP / phase) on top, one column of checklists, tab bar at the bottom. */
  --bg: #edf1ef;
  --surface: #ffffff;
  --surface-2: #f4f7f5;
  --ink: #15201b;
  --muted: #56665f;
  --line: #d3dcd7;
  --mine: #0c7a53;
  --mine-soft: #dcf0e7;
  --opp: #b2421b;
  --opp-soft: #f7e3da;
  --on-turn: #ffffff;
  --cp: #8e6210;
  --cp-soft: #f4e9d1;
  --warn: #9a5600;
  --warn-soft: #fbecd6;
  --s1: #1d6aad;
  --s2: #7a4cc0;
  --s3: #b23f7e;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1311;
    --surface: #151d1a;
    --surface-2: #1b2622;
    --ink: #e3ebe7;
    --muted: #98a9a1;
    --line: #29352f;
    --mine: #45d09a;
    --mine-soft: #15332a;
    --opp: #f0895c;
    --opp-soft: #3b231a;
    --on-turn: #0b120f;
    --cp: #e5b853;
    --cp-soft: #382e16;
    --warn: #f1b45c;
    --warn-soft: #3a2b14;
    --s1: #6fb2ef;
    --s2: #b597ec;
    --s3: #ec8ec0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1311;
  --surface: #151d1a;
  --surface-2: #1b2622;
  --ink: #e3ebe7;
  --muted: #98a9a1;
  --line: #29352f;
  --mine: #45d09a;
  --mine-soft: #15332a;
  --opp: #f0895c;
  --opp-soft: #3b231a;
  --on-turn: #0b120f;
  --cp: #e5b853;
  --cp-soft: #382e16;
  --warn: #f1b45c;
  --warn-soft: #3a2b14;
  --s1: #6fb2ef;
  --s2: #b597ec;
  --s3: #ec8ec0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  --turn: var(--mine);
  --turn-soft: var(--mine-soft);
}
body[data-turn="opp"] { --turn: var(--opp); --turn-soft: var(--opp-soft); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--turn); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
p { margin: 0; }

/* ---------- Tracker ---------- */
.tracker {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface);
  border-top: 4px solid var(--turn);
  border-bottom: 1px solid var(--line);
  padding: 8px 16px 10px;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px;
}
.tr-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.det-chip {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px;
  padding: 4px 10px; font-size: 13px; font-weight: 500; max-width: 48%; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tr-controls { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper .lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.stepper button {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface-2); font-size: 18px; line-height: 1; display: grid; place-items: center;
}
.stepper .num { font-family: var(--font-display); font-weight: 700; font-size: 22px; min-width: 1.4ch; text-align: center; font-variant-numeric: tabular-nums; }
.stepper .of { font-size: 13px; color: var(--muted); margin-left: -3px; margin-right: 2px; }
.stepper.cp .num { color: var(--cp); }
.stepper.cp { background: var(--cp-soft); border-radius: 10px; padding: 2px 4px 2px 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 7px 11px; font-weight: 500; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--turn); color: var(--on-turn); font-weight: 600; }
.seg.neutral button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.tr-phases { display: flex; gap: 8px; align-items: stretch; }
.phase-list { display: flex; gap: 4px; overflow-x: auto; flex: 1 1 auto; min-width: 0; scrollbar-width: none; }
.phase-list::-webkit-scrollbar { display: none; }
.phase-list button {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 500; color: var(--muted);
}
.phase-list button[aria-current="step"] { background: var(--turn-soft); border-color: var(--turn); color: var(--ink); font-weight: 600; }
.next {
  flex: 0 0 auto; border: 0; border-radius: 8px; padding: 6px 12px;
  background: var(--turn); color: var(--on-turn); font-weight: 600; font-size: 14px; white-space: nowrap;
}
.next:disabled { opacity: .5; cursor: default; }

/* ---------- Main ---------- */
main { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(84px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.ctx { display: grid; gap: 4px; }
.ctx h1 { font-size: 26px; font-weight: 700; line-height: 1.15; }
.ctx h1 .who { color: var(--turn); }
.ctx .sub { color: var(--muted); font-size: 14px; }
.block { display: grid; gap: 10px; }
.block h2 { font-size: 15px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: baseline; gap: 8px; color: var(--ink); }
.block h2 .count { font-family: var(--font-body); font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); font-variant-numeric: tabular-nums; }
.block > .hint { color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); font-size: 14px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: var(--radius); }
.win { font-family: var(--font-body); font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

/* checklist */
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.check {
  display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px;
}
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--turn); }
.check label { display: grid; gap: 2px; cursor: pointer; }
.check .src { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.check.is-done { background: var(--surface-2); }
.check.is-done .txt { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: none; border-radius: 999px; padding: 0 7px; border: 1px solid var(--line); color: var(--muted); }
.tag.limit { border-color: var(--cp); color: var(--cp); }
.tag.used { background: var(--surface-2); }
.tag.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }

/* stratagem cards */
.cards { display: grid; gap: 8px; }
.strat {
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--turn);
  border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 5px;
}
.strat.core { border-left-color: var(--line); }
.strat.src-1 { border-left-color: var(--s1); }
.strat.src-2 { border-left-color: var(--s2); }
.strat.src-3 { border-left-color: var(--s3); }

/* stratagem overview grid */
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.lg { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--surface); }
.sw { width: 10px; height: 10px; border-radius: 2px; background: var(--line); flex: 0 0 auto; }
.sw.src-1 { background: var(--s1); } .sw.src-2 { background: var(--s2); } .sw.src-3 { background: var(--s3); } .sw.src-core { background: var(--muted); }
.ov { display: grid; gap: 14px; }
.ov-phase { display: grid; gap: 6px; }
.ov-phase h2 { font-size: 15px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; display: flex; gap: 8px; align-items: baseline; }
.ov-phase h2 .count { font-family: var(--font-body); font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }
.ov-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.ov-cell { display: grid; gap: 5px; align-content: start; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px; }
.ov-cell.now { border-color: var(--turn); background: var(--turn-soft); }
.ov-cap { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 4px; }
.ov-cap .nowtag { color: var(--turn); }
.ov-none { font-size: 13px; color: var(--muted); padding: 2px 2px 4px; }
.ov-item {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1px 6px; align-items: baseline; text-align: left;
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--muted);
  border-radius: 7px; padding: 6px 7px;
}
.ov-item.src-1 { border-left-color: var(--s1); } .ov-item.src-2 { border-left-color: var(--s2); } .ov-item.src-3 { border-left-color: var(--s3); }
.ov-item .cpb { font-size: 11.5px; padding: 0 5px; }
.ov-item .nm { font-weight: 600; font-size: 13.5px; line-height: 1.25; overflow-wrap: anywhere; }
.ov-item .wl { grid-column: 2; font-size: 11.5px; color: var(--muted); line-height: 1.3; }

/* bottom sheet for one stratagem */
.sheet-back { position: fixed; inset: 0; background: rgba(8, 12, 10, .45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 720px; max-height: 82%; overflow-y: auto; border-radius: 14px 14px 0 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); display: grid; gap: 10px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sheet-head .meta { font-size: 13px; }
.strat.is-used { opacity: .62; }
.strat header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.strat h3 { font-size: 16px; font-weight: 600; letter-spacing: .01em; flex: 1 1 auto; min-width: 0; }
.cpb { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--cp); background: var(--cp-soft); border-radius: 6px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
.meta { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .02em; }
.strat p b { font-weight: 600; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.strat .when { color: var(--ink); }
.strat footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 3px; }
.strat footer a { font-size: 13px; color: var(--muted); }
.use {
  border: 0; border-radius: 8px; padding: 7px 14px; font-weight: 600; font-size: 14px;
  background: var(--turn); color: var(--on-turn); min-height: 36px;
}
.use:disabled { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); cursor: default; }
.kw { font-size: .86em; font-weight: 600; letter-spacing: .03em; }
.tag.core { border-color: var(--ink); color: var(--ink); }
.slots { display: flex; flex-wrap: wrap; gap: 4px; }
.slots .tag { color: var(--ink); font-size: 12px; padding: 1px 8px; }
.tag.jump { text-decoration: none; font-size: 13px; padding: 3px 10px; background: var(--surface); }
.kwnote { font-size: 13px; color: var(--muted); }
.dp { font-family: var(--font-display); font-weight: 700; font-size: 12px; color: var(--cp); background: var(--cp-soft); border-radius: 6px; padding: 1px 6px; margin: 0 6px; font-variant-numeric: tabular-nums; }
.opt.off { opacity: .55; cursor: not-allowed; }
.opt .fd { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.opt .why { display: block; font-size: 12px; font-weight: 600; color: var(--warn); margin-top: 4px; }
.pips { display: flex; gap: 6px; }
.pips span { width: 34px; height: 10px; border-radius: 3px; background: var(--surface); border: 1px solid var(--line); }
.pips span.on { background: var(--cp); border-color: var(--cp); }
.pips span.over { background: var(--opp); border-color: var(--opp); }
.overline { font-size: 13px; font-weight: 600; color: var(--opp); }
.setting .sm { font-size: 12px; color: var(--muted); }
section[id^="sec-"] { scroll-margin-top: 170px; }
.ab { font-size: .86em; font-weight: 600; white-space: nowrap; }

.rules-note { font-size: 13px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; }

/* always on */
.always { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.always li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 12px; display: grid; gap: 2px; }
.always .src { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.always .nm { font-weight: 600; }

/* log */
.log-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-weight: 500; font-size: 14px; }
.ghost:disabled { opacity: .5; cursor: default; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 13px; }
.log li { display: grid; grid-template-columns: 9.5em 1fr; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.log .at { color: var(--muted); font-variant-numeric: tabular-nums; }

/* army */
.opts { display: grid; gap: 6px; }
.opt {
  display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer;
}
.opt input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--mine); }
.opt .nm { font-weight: 600; }
.opt .sm { font-size: 13px; color: var(--muted); }
.opt.on { border-color: var(--mine); background: var(--mine-soft); }
.custom-form { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.custom-form label.f { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.custom-form input[type="text"], .custom-form select {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 8px 10px; min-height: 38px;
}
.f-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.f-row > div { display: grid; gap: 4px; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.chk input { width: 18px; height: 18px; accent-color: var(--mine); }
.primary { border: 0; border-radius: 8px; padding: 9px 14px; background: var(--mine); color: var(--on-turn); font-weight: 600; justify-self: start; }
.custom-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.custom-list li { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; }
.custom-list .sm { font-size: 12px; color: var(--muted); }
.danger { border: 1px solid var(--opp); color: var(--opp); background: transparent; border-radius: 8px; padding: 8px 14px; font-weight: 600; justify-self: start; }
.danger.armed { background: var(--opp); color: var(--on-turn); }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.about { font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
.about a { color: inherit; }

/* tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
.tabbar button { border: 0; background: transparent; padding: 8px 4px; border-radius: 8px; font-weight: 500; font-size: 14px; color: var(--muted); }
.tabbar button[aria-current="page"] { color: var(--ink); background: var(--surface-2); font-weight: 600; box-shadow: inset 0 -2px 0 var(--turn); }

.toast {
  position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 500;
  opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); text-align: center; z-index: 20;
}
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media (max-width: 380px) {
  .seg button { padding: 7px 8px; font-size: 13px; }
  .f-row { grid-template-columns: 1fr; }
  .ctx h1 { font-size: 23px; }
}
</style>
</head>
<body data-turn="mine">
<header class="tracker" id="tracker"></header>
<main id="main"></main>
<nav class="tabbar" id="tabbar" aria-label="Views"></nav>
<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   DATA — summaries paraphrased from Wahapedia (Necrons, 11th ed., App v2.8.1,
   Oct 2026) and 11th-edition core rules coverage. Checked 10 Nov 2026.
   slot = "turn:phase"  turn: mine | opp | any   phase: command | movement |
   shooting | charge | fight | end | any       w = start | during | react | end
   ===================================================================== */
const WAHA = "https://wahapedia.ru/wh40k11ed/factions/necrons";

const PHASES = [
  { id: "command", label: "Command" },
  { id: "movement", label: "Movement" },
  { id: "shooting", label: "Shooting" },
  { id: "charge", label: "Charge" },
  { id: "fight", label: "Fight" },
  { id: "end", label: "End of turn" }
];
const WIN = {
  start: { o: 0, label: "Start of phase" },
  during: { o: 1, label: "During the phase" },
  react: { o: 2, label: "In reaction" },
  end: { o: 3, label: "End of phase" }
};

const S = (id, name, cp, type, slots, w, when, target, effect, x) =>
  Object.assign({ id, name, cp, type, slots, w, when, target, effect }, x || {});

const CORE = [
  S("core-reroll", "Command Re-roll", 1, "Core", ["any:any"], "react",
    "Any phase, just after you roll for an Advance, Charge, Damage, Hazard, Hit, Save or Wound roll, or for the number of attacks.",
    "The unit or model that rolled.",
    "Re-roll that roll. If several dice were rolled together, re-roll one of them (Charge rolls are re-rolled in full)."),
  S("core-bravery", "Insane Bravery", 1, "Core", ["mine:command"], "during",
    "Battle-shock step of your Command phase, just before you take a Battle-shock test for one of your units.",
    "That unit.",
    "The test is passed automatically.", { limit: "battle" }),
  S("core-overwatch", "Fire Overwatch", 1, "Core", ["opp:movement"], "end",
    "End of your opponent's Movement phase.",
    "One of your unengaged units (not TITANIC).",
    "Your unit shoots using snap shooting: one visible enemy unit within 24\", hits only on unmodified 6s (never Critical Hits), no Hit re-rolls."),
  S("core-ingress", "Rapid Ingress", 1, "Core", ["opp:movement"], "end",
    "End of your opponent's Movement phase.",
    "One of your units in Strategic Reserves (not AIRCRAFT).",
    "Your unit makes an ingress move and arrives on the battlefield.",
    { restr: "Not in the first battle round." }),
  S("core-heroic", "Heroic Intervention", 1, "Core", ["opp:charge"], "end",
    "End of your opponent's Charge phase.",
    "One of your unengaged units within 12\" of an enemy unit (a VEHICLE only if it is a CHARACTER or WALKER).",

function freshGame(prev) {
  const keep = prev || {};

    dets: Array.isArray(keep.dets) ? keep.dets.filter(id => DET[id]) : ["awakened"],
    enh: keep.enh || [],
    units: keep.units || [],

    settings: Object.assign({ first: "mine", autoCP: true, size: "strike", dp: 3 }, keep.settings || {}),

    listTurn: "mine"

}

  if (!Array.isArray(st.dets)) { st.dets = st.det && DET[st.det] ? [st.det] : ["awakened"]; delete st.det; }

}

  if (matches(ARMY_RULE, turn, phase)) list.push(ARMY_RULE);
  selDets().forEach(det => {
    det.ruleReminders.forEach(r => matches(r, turn, phase) && list.push(Object.assign({ src: "Detachment rule" }, r)));
    det.enh.filter(e => state.enh.includes(e.id) && e.slots).forEach(e => matches(e, turn, phase) && list.push(Object.assign({ src: "Enhancement" }, e)));
  });
  UNITS.filter(u => state.units.includes(u.id) && u.slots).forEach(u => matches(u, turn, phase) && list.push(Object.assign({ src: "Unit" }, u)));
  state.custom.forEach(c => matches(c, turn, phase) && list.push(Object.assign({ src: "Your reminder" }, c)));
  return list.sort(byWindow);
}

function limitTag(limit) {
  if (!limit) return "";
  const t = { battle: "Once per battle", turn: "Once per turn", round: "Once per round" }[limit];
  return `<span class="tag limit">${t}</span>`;
}
const verifyTag = it => (it.verify ? `<span class="tag warn" title="I couldn't confirm the exact wording: check Wahapedia">Check wording</span>` : "");

/* ---------------- mutations ---------------- */
function snapshot() {
  const copy = Object.assign({}, state); delete copy.view; delete copy.listTurn; delete copy.stratMode;
  undoStack.push(JSON.stringify(copy));
  if (undoStack.length > 50) undoStack.shift();
}
function save() { store.set(state); }
function mutate(fn) { snapshot(); fn(); save(); render(); }
function undo() {
  if (!undoStack.length) { toast("Nothing to undo"); return; }
  const view = state.view, listTurn = state.listTurn, stratMode = state.stratMode;
  state = Object.assign(JSON.parse(undoStack.pop()), { view, listTurn, stratMode });
  save(); render(); toast("Undone");
}
function addLog(text) {
  const who = state.turn === "mine" ? "Your" : "Opp's";
  state.log.unshift({ at: `R${state.round} · ${who} ${phaseLabel(state.phase)}`, text });
  state.log = state.log.slice(0, 60);
}

function nextInfo() {
  const i = PHASES.findIndex(p => p.id === state.phase);
  if (i < PHASES.length - 1) return { label: PHASES[i + 1].label, done: false };
  const first = state.settings.first;
  if (state.turn === first) return { label: other(first) === "mine" ? "Your turn" : "Opp's turn", done: false };
  if (state.round >= 5) return { label: "Battle over", done: true };
  return { label: `Round ${state.round + 1}`, done: false };
}

function nextPhase() {
  const i = PHASES.findIndex(p => p.id === state.phase);
  if (i < PHASES.length - 1) { state.phase = PHASES[i + 1].id; return; }
  const first = state.settings.first;
  if (state.turn === first) state.turn = other(first);
  else {
    if (state.round >= 5) { toast("Battle round 5 is over: the battle has ended"); return; }
    state.round += 1; state.turn = first;
  }
  state.phase = "command";
  if (state.settings.autoCP) { state.cp += 1; addLog("+1CP (Command phase)"); toast(`+1CP for the Command phase · ${state.cp}CP`); }
  window.scrollTo(0, 0);
}

function useStrat(id) {
  const s = ALL_STRATS[id];
  if (!s || stratStatus(s)) return;
  if (state.cp < s.cp) { toast(`Not enough CP: ${s.name} costs ${s.cp}CP`); return; }
  state.cp -= s.cp;
  addTo(state.used, phaseKey(), id);
  if (s.limit === "battle") state.battle[id] = true;
  if (s.limit === "turn") addTo(state.perTurn, turnKey(), id);
  if (s.limit === "round") addTo(state.perRound, String(state.round), id);
  addLog(`${s.name} (−${s.cp}CP)`);
  toast(`${s.name}: −${s.cp}CP · ${state.cp}CP left`);
}

function toggleReminder(id, limit, on) {
  if (limit === "battle") { if (on) state.battle[id] = true; else delete state.battle[id]; }
  else if (limit === "turn") { on ? addTo(state.perTurn, turnKey(), id) : removeFrom(state.perTurn, turnKey(), id); }
  else if (limit === "round") { on ? addTo(state.perRound, String(state.round), id) : removeFrom(state.perRound, String(state.round), id); }
  else { on ? addTo(state.done, phaseKey(), id) : removeFrom(state.done, phaseKey(), id); }
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

/* ---------------- rendering ---------------- */
function renderTracker() {
  const n = nextInfo();
  return `
  <div class="tr-top">
    <div class="seg" role="group" aria-label="Whose turn">
      <button data-act="turn" data-turn="mine" aria-pressed="${state.turn === "mine"}">My turn</button>
      <button data-act="turn" data-turn="opp" aria-pressed="${state.turn === "opp"}">Opponent</button>
    </div>
    <button class="det-chip" data-act="view" data-view="army" title="Change detachments">${dpUsed()}/${state.settings.dp} DP · ${esc(detLabel())}</button>
  </div>
  <div class="tr-controls">
    <div class="stepper" role="group" aria-label="Battle round">
      <span class="lbl">Round</span>
      <button data-act="round" data-d="-1" aria-label="Previous battle round">−</button>
      <output class="num" aria-live="polite">${state.round}</output><span class="of">/5</span>
      <button data-act="round" data-d="1" aria-label="Next battle round">+</button>
    </div>
    <div class="stepper cp" role="group" aria-label="Command points">
      <span class="lbl">CP</span>
      <button data-act="cp" data-d="-1" aria-label="Remove 1 CP">−</button>
      <output class="num" aria-live="polite">${state.cp}</output>
      <button data-act="cp" data-d="1" aria-label="Add 1 CP">+</button>
    </div>
  </div>
  <div class="tr-phases">
    <div class="phase-list" role="group" aria-label="Phase">
      ${PHASES.map(p => `<button data-act="phase" data-phase="${p.id}" ${p.id === state.phase ? 'aria-current="step"' : ""}>${p.label}</button>`).join("")}
    </div>
    <button class="next" data-act="next" ${n.done ? "disabled" : ""} aria-label="Go to ${esc(n.label)}">${esc(n.label)} ›</button>
  </div>`;
}

function srcClass(s) {
  if (s.type === "Core") return "src-core";
  const i = selDets().findIndex(d => d.id === s.det);
  return i >= 0 ? `src-${i + 1}` : "";
}
let sheetId = null;

function slotChip(sl) {
  const [t, p] = sl.split(":");
  if (p === "any") return t === "any" ? "Any phase" : (t === "mine" ? "Any phase of your turn" : "Any phase of opponent's turn");
  const who = { mine: "Your", opp: "Opponent's", any: "Either player's" }[t];
  return p === "end" ? `End of ${t === "mine" ? "your" : t === "opp" ? "opponent's" : "either"} turn` : `${who} ${phaseLabel(p)}`;
}

function stratCard(s, opts) {
  const status = opts.interactive ? stratStatus(s) : null;
  const short = opts.interactive && !status && state.cp < s.cp;
  const btn = !opts.interactive ? "" :
    status ? `<button class="use" disabled>${status}</button>` :
    short ? `<button class="use" disabled>Need ${s.cp}CP</button>` :
    `<button class="use" data-act="use" data-id="${s.id}">Use · ${s.cp}CP</button>`;
  const isCore = s.type === "Core";
  const typeLine = isCore ? "Core stratagem · every army" : `${s.type === "Detachment" ? "Detachment stratagem" : s.type} · ${esc(s.srcName)}`;
  return `
  <article class="strat ${isCore ? "core" : srcClass(s)} ${status ? "is-used" : ""}">
    <header><span class="cpb">${s.cp}CP</span><h3>${esc(s.name)}</h3>${isCore ? `<span class="tag core">Core</span>` : ""}${limitTag(s.limit)}${verifyTag(s)}</header>
    <p class="meta">${typeLine}</p>
    ${opts.showSlots ? `<p class="slots">${s.slots.map(sl => `<span class="tag">${esc(slotChip(sl))}</span>`).join("")}</p>` : ""}
    <p class="when"><b>When</b>${fmt(s.when)}</p>
    <p><b>Target</b>${fmt(s.target)}</p>
    <p><b>Effect</b>${fmt(s.effect)}</p>
    ${s.restr ? `<p><b>Restriction</b>${fmt(s.restr)}</p>` : ""}
    ${s.keyword ? `<p class="kwnote"><b>Needs</b>units with the ${fmt(s.keyword)} keyword. No Necron unit has it, so it is hidden in the Game tab and the Overview.</p>` : ""}
    <footer>${isCore ? "<span></span>" : `<a href="${WAHA}" target="_blank" rel="noopener">Full text on Wahapedia ↗</a>`}${btn}</footer>
  </article>`;
}

function groupedCards(list, opts) {
  const groups = {};
  list.forEach(s => (groups[s.w] = groups[s.w] || []).push(s));
  return Object.keys(WIN).filter(w => groups[w]).map(w => `
    <h3 class="win">${state.phase === "end" && opts.interactive ? "End of turn" : WIN[w].label}</h3>
    <div class="cards">${groups[w].sort(byWindow).map(s => stratCard(s, opts)).join("")}</div>`).join("");
}

function renderGame() {
  const dets = selDets();
  const reminders = timedReminders(state.turn, state.phase);
  const strats = stratPool().filter(s => matches(s, state.turn, state.phase)).sort(byWindow);
  const doneCount = reminders.filter(reminderDone).length;
  const who = state.turn === "mine" ? "Your" : "Opponent's";
  const title = state.phase === "end"
    ? `End of <span class="who">${state.turn === "mine" ? "your" : "your opponent's"}</span> turn`
    : `<span class="who">${who}</span> ${phaseLabel(state.phase)} phase`;
  const available = strats.filter(s => !stratStatus(s) && state.cp >= s.cp).length;
  const nCore = strats.filter(s => s.type === "Core").length;

  const checks = reminders.length ? `<ul class="checks">${reminders.map(r => {
    const on = reminderDone(r);
    const usedNote = on && r.limit === "battle" ? `<span class="tag used">Used</span>` : "";
    const cid = `chk-${r.id}`;
    return `<li class="check ${on ? "is-done" : ""}">
      <input type="checkbox" id="${cid}" data-check="${r.id}" data-limit="${r.limit || ""}" ${on ? "checked" : ""}>
      <label for="${cid}">
        <span class="src">${esc(r.src)}${r.name ? " · " + esc(r.name) : ""} ${limitTag(r.limit)}${usedNote}${verifyTag(r)}</span>
        <span class="txt">${fmt(dyn(r.text))}</span>
      </label></li>`;
  }).join("")}</ul>` : `<p class="empty">Nothing to do in this step.</p>`;

  const passive = [
    ...dets.map(d => ({ src: `Detachment rule · ${d.name}`, name: d.rule.name, text: d.rule.text })),
    ...dets.flatMap(d => d.enh).filter(e => state.enh.includes(e.id) && !e.slots).map(e => ({ src: "Enhancement", name: e.name, text: e.text })),
    ...UNITS.filter(u => state.units.includes(u.id) && !u.slots).map(u => ({ src: "Unit", name: u.name, text: u.text }))
  ];

  const log = state.log.slice(0, 8);
  return `
  <section class="ctx">
    <h1>${title}</h1>
    <p class="sub">Battle round ${state.round} · ${esc(detLabel())} · ${available} stratagem${available === 1 ? "" : "s"} usable now</p>
    ${armyProblems().map(t => `<p class="overline">${esc(t)} Fix it on the Army tab.</p>`).join("")}
  </section>

  <section class="block" aria-labelledby="h-check">
    <h2 id="h-check">Checklist <span class="count">${doneCount}/${reminders.length} done</span></h2>
    ${checks}
  </section>

  <section class="block" aria-labelledby="h-strats">
    <h2 id="h-strats">Stratagems now <span class="count">${strats.length - nCore} detachment · ${nCore} core</span></h2>
    <p class="rules-note">Each Stratagem once per phase. A unit can be targeted by only one Stratagem per phase. Battle-shocked units can't be targeted.</p>
    ${strats.length ? groupedCards(strats, { interactive: true }) : `<p class="empty">No stratagems for this step.</p>`}
  </section>

  <section class="block" aria-labelledby="h-always">
    <h2 id="h-always">Always on</h2>
    <ul class="always">${passive.length ? passive.map(p => `<li><span class="src">${esc(p.src)}</span><span class="nm">${esc(p.name)}</span><span>${fmt(dyn(p.text))}</span></li>`).join("") : `<li><span>No detachment picked. Choose one or more on the Army tab.</span></li>`}</ul>
  </section>

  <section class="block" aria-labelledby="h-log">
    <div class="log-head"><h2 id="h-log">Game log</h2>
      <button class="ghost" data-act="undo" ${undoStack.length ? "" : "disabled"}>Undo last change</button></div>
    <ul class="log">${log.map(l => `<li><span class="at">${esc(l.at)}</span><span>${esc(l.text)}</span></li>`).join("")}</ul>
  </section>`;
}

const SHORT_WIN = { start: "Start of phase", during: "", react: "Reaction", end: "End of phase" };

function renderOverview() {
  const dets = selDets();
  const pool = CORE.filter(s => !s.keyword).concat(...dets.map(d => d.strats));
  const rows = [{ id: "any", label: "Any phase" }].concat(PHASES.filter(p => p.id !== "end"));
  const cols = [{ id: "mine", label: "Your turn" }, { id: "opp", label: "Opponent's turn" }];
  const inCell = (s, t, p) => s.slots.some(sl => { const [st, sp] = sl.split(":"); return (st === "any" || st === t) && sp === p; });
  const legend = dets.map((d, i) => `<span class="lg"><span class="sw src-${i + 1}"></span>${esc(d.name)} · ${d.strats.length}</span>`).join("")
    + `<span class="lg"><span class="sw src-core"></span>Core · ${CORE.filter(s => !s.keyword).length}</span>`;
  const item = s => {
    const extra = [SHORT_WIN[s.w], s.limit ? { battle: "once per battle", turn: "once per turn", round: "once per round" }[s.limit] : ""].filter(Boolean).join(" · ");
    return `<button class="ov-item ${srcClass(s)}" data-act="sheet" data-id="${s.id}" aria-haspopup="dialog">
      <span class="cpb">${s.cp}CP</span><span class="nm">${esc(s.name)}</span>${extra ? `<span class="wl">${esc(extra)}</span>` : ""}</button>`;
  };
  const body = rows.map(r => {
    const cells = cols.map(c => ({ c, list: pool.filter(s => inCell(s, c.id, r.id)).sort(byWindow) }));
    const total = new Set(cells.flatMap(x => x.list.map(s => s.id))).size;
    return `<section class="ov-phase" aria-label="${esc(r.label)}">
      <h2>${esc(r.label)}${r.id === "any" ? "" : " phase"} <span class="count">${total}</span></h2>
      <div class="ov-row">${cells.map(({ c, list }) => {
        const now = state.turn === c.id && (state.phase === r.id || (r.id === "any" && state.phase !== "end"));
        return `<div class="ov-cell ${now && r.id !== "any" ? "now" : ""}">
          <div class="ov-cap"><span>${c.label}</span>${now && r.id !== "any" ? `<span class="nowtag">Now</span>` : ""}</div>
          ${list.length ? list.map(item).join("") : `<div class="ov-none">None</div>`}
        </div>`;
      }).join("")}</div>
    </section>`;
  }).join("");
  return `<div class="legend" aria-label="Colour per source">${legend}</div><div class="ov">${body}</div>`;
}

function renderSheet() {
  const s = sheetId && ALL_STRATS[sheetId];
  if (!s) return "";

    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(s.name)}">

function renderStratCards() {
  const order = s => {
    const [t, p] = s.slots[0].split(":");
    const pi = p === "any" ? -1 : PHASES.findIndex(x => x.id === p);
    return pi * 10 + (t === "mine" ? 0 : t === "any" ? 1 : 2) + WIN[s.w].o / 10;
  };
  const dets = selDets();
  const sections = dets.map(d => ({ title: d.name, sub: `${d.dp} DP · Detachment rule: ${d.rule.name}`, list: d.strats }))
    .concat([{ title: "Core stratagems", sub: "Available to every army. Explosives and Smokescreen need keywords no Necron unit has.", list: CORE }]);
  const jump = sections.map((sec, i) => `<button class="tag jump" data-act="jump" data-to="sec-${i}">${esc(sec.title)}</button>`).join("");
  return `
  <p class="slots">${jump}</p>
  ${sections.map((sec, i) => `<section class="block" id="sec-${i}">
    <h2>${esc(sec.title)} <span class="count">${sec.list.length}</span></h2>
    <p class="hint">${esc(sec.sub)}</p>
    <div class="cards">${sec.list.slice().sort((a, b) => order(a) - order(b)).map(s => stratCard(s, { interactive: false, showSlots: true })).join("")}</div>
  </section>`).join("")}`;
}

function slotText(c) {
  const [t, p] = c.slots[0].split(":");
  const tt = { mine: "Your turn", opp: "Opponent's turn", any: "Either turn" }[t];
  const pp = p === "any" ? "any phase" : phaseLabel(p);
  return `${tt} · ${pp} · ${WIN[c.w].label.toLowerCase()}${c.limit ? " · once per battle" : ""}`;
}

        <div><label class="f" for="c-turn">Turn</label>
          <select id="c-turn"><option value="mine">My turn</option><option value="opp">Opponent's turn</option><option value="any">Either turn</option></select></div>
        <div><label class="f" for="c-phase">Phase</label>
          <select id="c-phase">${PHASES.map(p => `<option value="${p.id}">${p.label}</option>`).join("")}<option value="any">Any phase</option></select></div>
        <div><label class="f" for="c-win">When</label>
          <select id="c-win">${Object.keys(WIN).map(w => `<option value="${w}" ${w === "during" ? "selected" : ""}>${WIN[w].label}</option>`).join("")}</select></div>
      </div>
      <label class="chk" for="c-once"><input type="checkbox" id="c-once"> Once per battle</label>
      <button type="submit" class="primary">Add reminder</button>
    </form>
    ${state.custom.length ? `<ul class="custom-list">${state.custom.map(c => `
      <li><span>${esc(c.text)}<br><span class="sm">${esc(slotText(c))}</span></span>
      <button class="ghost" data-act="del-custom" data-id="${c.id}" aria-label="Delete reminder">Delete</button></li>`).join("")}</ul>` : ""}
  </section>

  <section class="block" aria-labelledby="h-settings">
    <h2 id="h-settings">Game</h2>
    <div class="setting"><span>Who takes the first turn</span>
      <div class="seg neutral" role="group" aria-label="First turn">
        <button data-act="first" data-turn="mine" aria-pressed="${state.settings.first === "mine"}">Me</button>
        <button data-act="first" data-turn="opp" aria-pressed="${state.settings.first === "opp"}">Opponent</button>
      </div></div>
    <label class="setting" for="autocp"><span>Add 1CP automatically in each Command phase</span>
      <input type="checkbox" id="autocp" ${state.settings.autoCP ? "checked" : ""} style="width:20px;height:20px;accent-color:var(--mine)"></label>
    <button class="danger" data-act="newgame" id="newgame">Start a new game</button>
  </section>

  <section class="about">
    <p>Rules are summarised in my own words from <a href="${WAHA}" target="_blank" rel="noopener">Wahapedia's Necrons page</a> (11th edition, Necrons rules v2.8.1, October 2026, including Detachment Point costs) and the 11th-edition core rules, and checked point by point against them on 10 November 2026. Rules change with updates, so check the full wording if something looks off. A "Check wording" tag marks any entry that couldn't be confirmed.</p>
    <p>Lord and Nemesor Zahndrekh are Legends datasheets on Wahapedia, so they usually aren't allowed in matched play.</p>
    <p>Unofficial tool for personal use. Warhammer 40,000 and its rules belong to Games Workshop. Powered by Wahapedia.</p>
    <p>Your game is saved in this browser only.</p>
  </section>`;
}

function renderTabs() {
  const tabs = [["game", "Game"], ["strats", "Stratagems"], ["army", "Army"]];
  return tabs.map(([id, label]) => `<button data-act="view" data-view="${id}" ${state.view === id ? 'aria-current="page"' : ""}>${label}</button>`).join("");
}

function render() {
  const focusId = document.activeElement && document.activeElement.id;
  document.body.dataset.turn = state.turn;
  document.getElementById("tracker").innerHTML = renderTracker();
  const main = document.getElementById("main");
  main.innerHTML = state.view === "army" ? renderArmy() : state.view === "strats" ? renderStrats() : renderGame();
  document.getElementById("tabbar").innerHTML = renderTabs();
  if (state.view !== "strats") sheetId = null;
  document.getElementById("sheet-root").innerHTML = renderSheet();
  document.body.style.overflow = sheetId ? "hidden" : "";
  const list = document.querySelector(".phase-list"), cur = list && list.querySelector('[aria-current="step"]');
  if (cur) list.scrollLeft = Math.max(0, cur.offsetLeft - list.offsetLeft - (list.clientWidth - cur.offsetWidth) / 2);
  if (focusId) { const el = document.getElementById(focusId); if (el) el.focus({ preventScroll: true }); }
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  switch (act) {
    case "view": state.view = b.dataset.view; save(); render(); window.scrollTo(0, 0); break;
    case "round": mutate(() => { state.round = Math.min(5, Math.max(1, state.round + Number(b.dataset.d))); }); break;
    case "turn": if (state.turn !== b.dataset.turn) mutate(() => { state.turn = b.dataset.turn; }); break;
    case "cp": mutate(() => { state.cp = Math.max(0, state.cp + Number(b.dataset.d)); }); break;
    case "phase": if (state.phase !== b.dataset.phase) mutate(() => { state.phase = b.dataset.phase; if (state.view !== "game") state.view = "game"; }); else if (state.view !== "game") { state.view = "game"; save(); render(); } break;
    case "next": mutate(() => { nextPhase(); state.view = "game"; }); break;
    case "use": mutate(() => useStrat(b.dataset.id)); break;
    case "undo": undo(); break;
    case "size": mutate(() => {
      const z = SIZES.find(x => x.id === b.dataset.size);
      state.settings.size = z.id; if (z.dp) state.settings.dp = z.dp;
    }); break;
    case "smode": state.stratMode = b.dataset.mode; save(); render(); break;
    case "sheet": sheetId = b.dataset.id; render(); { const c = document.getElementById("sheet-close"); if (c) c.focus(); } break;
    case "sheet-close": if (e.target === b || b.id === "sheet-close") { const back = sheetId; sheetId = null; render(); const o = document.querySelector(`[data-act="sheet"][data-id="${back}"]`); if (o) o.focus({ preventScroll: true }); } break;
    case "jump": { const el = document.getElementById(b.dataset.to); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); break; }
    case "dp": mutate(() => { state.settings.dp = Math.min(9, Math.max(1, state.settings.dp + Number(b.dataset.d))); }); break;
    case "first": mutate(() => { state.settings.first = b.dataset.turn; }); break;
    case "del-custom": mutate(() => { state.custom = state.custom.filter(c => c.id !== b.dataset.id); }); break;
    case "newgame":
      if (b.classList.contains("armed")) {
        mutate(() => { state = freshGame(state); state.view = "game"; });
        toast("New game: round 1, Command phase, 1CP");
        window.scrollTo(0, 0);
      } else {
        b.classList.add("armed"); b.textContent = "Tap again to reset the game";
        setTimeout(() => { const n = document.getElementById("newgame"); if (n) { n.classList.remove("armed"); n.textContent = "Start a new game"; } }, 3500);
      }
      break;
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheetId) { const back = sheetId; sheetId = null; render(); const o = document.querySelector(`[data-act="sheet"][data-id="${back}"]`); if (o) o.focus({ preventScroll: true }); }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.check) mutate(() => toggleReminder(t.dataset.check, t.dataset.limit, t.checked));
  else if (t.dataset.det) {
    const d = DET[t.dataset.det];
    if (t.checked) {
      const why = blockReason(d);
      if (why) { t.checked = false; toast(why); return; }
      mutate(() => { state.dets = state.dets.concat(d.id); });
      toast(`${d.name} added · ${dpUsed()}/${state.settings.dp} DP`);
    } else {
      const ids = d.enh.map(x => x.id);
      mutate(() => { state.dets = state.dets.filter(x => x !== d.id); state.enh = state.enh.filter(x => !ids.includes(x)); });
      toast(`${d.name} removed · ${dpUsed()}/${state.settings.dp} DP`);
    }
  }
  else if (t.dataset.enh) mutate(() => { state.enh = t.checked ? state.enh.concat(t.dataset.enh) : state.enh.filter(x => x !== t.dataset.enh); });
  else if (t.dataset.unit) mutate(() => { state.units = t.checked ? state.units.concat(t.dataset.unit) : state.units.filter(x => x !== t.dataset.unit); });
  else if (t.id === "autocp") mutate(() => { state.settings.autoCP = t.checked; });
});

document.addEventListener("submit", e => {
  if (e.target.id !== "custom-form") return;
  e.preventDefault();
  const text = document.getElementById("c-text").value.trim();
  if (!text) return;
  const turn = document.getElementById("c-turn").value;
  const phase = document.getElementById("c-phase").value;
  const w = document.getElementById("c-win").value;
  const once = document.getElementById("c-once").checked;
  mutate(() => {
    state.custom.push({ id: "c" + Date.now().toString(36), name: "", text, slots: [`${turn}:${phase}`], w, limit: once ? "battle" : null });
  });
  toast("Reminder added");
});

render();
</script>
</body>
</html>
